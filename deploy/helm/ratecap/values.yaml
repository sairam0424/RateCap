redis:
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  port: 6379
  sentinel:
    enabled: false
    replicas: 3
    port: 26379
    masterName: mymaster
    quorum: 2

core:
  image:
    repository: ratecap-core
    tag: latest
    pullPolicy: IfNotPresent
  grpcPort: 9090
  healthPort: 9091
  replicaCount: 1

sidecar:
  image:
    repository: ratecap-sidecar
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  maxInflightRequests: 500
  replicaCount: 1

sampleapp:
  enabled: false
  image:
    repository: ratecap-sampleapp
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000

# config.yaml is the content of ratecap.yaml, mounted into core via a
# ConfigMap. Defaults mirror deploy/ratecap.yaml (the docker-compose demo's
# config) exactly, so a chart install behaves the same way out of the box.
# BEGIN GENERATED CONFIG (see generate-config.sh) — do not hand-edit between these markers
config:
  yaml: |
    sync_rate: 5
    tiers:
      rate_limiter:
        default_rate: 2
        default_burst: 5
        shadow_mode: false
      concurrency_limiter:
        default_max_concurrent: 3
        max_request_duration_ms: 30000
        shadow_mode: false
        # Bounded queueing (v2 Phase 3) — off by default, uncomment to enable:
        # queueing_enabled: true
        # max_backlog: 20
        # max_queue_wait_ms: 2000
        # poll_interval_ms: 25
      fleet_shedder:
        default_max_concurrent: 5
        reserved_critical_pct: 40
        max_request_duration_ms: 30000
        shadow_mode: false
# END GENERATED CONFIG

# sharedSecret is BYO-only: the chart never generates or stores a secret
# value. Create the Secret out-of-band first, e.g.:
#   kubectl create secret generic ratecap-shared-secret \
#     --from-literal=shared-secret=<your-secret-value>
# then set existingSecretName/existingSecretKey to match.
sharedSecret:
  existingSecretName: ""
  existingSecretKey: "shared-secret"

# concurrencySigningKey is BYO-only, same convention as sharedSecret above:
# the chart never generates or stores a value. Create the Secret out-of-band
# first, e.g.:
#   kubectl create secret generic ratecap-concurrency-signing-key \
#     --from-literal=signing-key=<your-signing-key>
# then set existingSecretName/existingSecretKey to match. Consumed only by
# core (signs/verifies Tier 2 concurrency tokens) — sidecar never needs it.
concurrencySigningKey:
  existingSecretName: ""
  existingSecretKey: "signing-key"

# adminSecret is BYO-only, same convention as sharedSecret above: the chart
# never generates or stores a value. Gates the sidecar's /admin/set-limit
# incident-response lever — deliberately separate from sharedSecret, see
# SECURITY.md. Create the Secret out-of-band first, e.g.:
#   kubectl create secret generic ratecap-admin-secret \
#     --from-literal=admin-secret=<your-admin-secret-value>
# then set existingSecretName/existingSecretKey to match. Consumed only by
# the sidecar (core has no concept of this secret).
adminSecret:
  existingSecretName: ""
  existingSecretKey: "admin-secret"

# tls is optional and off by default, matching the existing mTLS precedent
# (RATECAP_TLS_CERT_PATH/KEY_PATH/CA_PATH). Also BYO-only: create the Secret
# out-of-band first. IMPORTANT: certs' subjectAltName MUST match this
# release's actual Service names (<release-name>-core / <release-name>-sidecar)
# — deploy/generate-demo-certs.sh's output (SAN: DNS:core / DNS:sidecar) will
# NOT work here and fails with no server-side log (see README.md). Example:
#   kubectl create secret generic ratecap-core-tls \
#     --from-file=tls.crt=core-cert.pem --from-file=tls.key=core-key.pem \
#     --from-file=ca.crt=ca.pem
# then set enabled: true and the two existingSecretName fields below.
tls:
  enabled: false
  # mode mirrors RATECAP_TLS_MODE on services/core (permissive|strict).
  # "strict" preserves this chart's original tls.enabled=true behavior
  # exactly: a single all-TLS listener, no second :9443 listener. Only
  # takes effect when tls.enabled is true.
  mode: "strict"
  core:
    existingSecretName: ""
  sidecar:
    existingSecretName: ""

# networkPolicy is off by default, matching this chart's tls/sentinel
# opt-in convention. When enabled, it operationalizes the network-boundary
# claim SECURITY.md already makes ("must run on private, trusted network
# only") at the Kubernetes level — restricting which pods can reach core's
# gRPC/health ports and Redis's port, rather than leaving that entirely to
# operator-managed cluster-wide policy. Requires a CNI that enforces
# NetworkPolicy (Calico, Cilium, etc.) — on a CNI that doesn't, this
# resource is created but has no effect (fails open, not closed).
networkPolicy:
  enabled: false
