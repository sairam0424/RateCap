[project]
name = "ratecap"
version = "0.1.1"
description = "Thin Python client for the RateCap sidecar"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/sairam0424/RateCap"
Repository = "https://github.com/sairam0424/RateCap"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# tests/*.py deliberately puts sys.path.insert(...) before the ratecap/
# fake_sidecar imports it enables — see the comments in test_client.py and
# test_cost.py for why (unittest discover's start_dir sys.path rules).
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
