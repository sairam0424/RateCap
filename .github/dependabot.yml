version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/cli"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/proto"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/services/core"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/services/sidecar"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/deploy/sampleapp"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/packages/sdks/go"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/packages/sdks/python"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
