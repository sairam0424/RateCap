name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # proto is 100% generated protobuf code with no hand-written logic
          # and zero test files, so its real coverage is 0% by construction
          # (verified locally) — the 50% floor below doesn't apply here.
          - module: proto
            floor: 0
          - module: services/core
            floor: 50
          - module: services/sidecar
            floor: 50
          - module: packages/sdks/go
            floor: 50
          # deploy/sampleapp is a demo binary with no tests by design (see
          # CLAUDE.md's build&test section) — real coverage is 0%.
          - module: deploy/sampleapp
            floor: 0
          - module: cli
            floor: 50
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Enforce coverage floor
        working-directory: ${{ matrix.module }}
        run: |
          if [ ! -s coverage.out ]; then
            echo "No coverage data for ${{ matrix.module }} (no test files) — skipping floor check"
            exit 0
          fi
          pct=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "Total coverage for ${{ matrix.module }}: ${pct}%"
          floor=${{ matrix.floor }}
          if (( $(echo "$pct < $floor" | bc -l) )); then
            echo "Coverage ${pct}% is below the ${floor}% floor for ${{ matrix.module }}" >&2
            exit 1
          fi

  core-integration-tests:
    # testcontainers-go-based Redis/Toxiproxy integration tests, isolated
    # into their own module (services/core/integrationtests) so the
    # production services/core module doesn't carry the moby/containerd/
    # gopsutil transitive tree. Docker is already available on ubuntu-latest
    # runners (the docker-build job below proves this), so no new CI
    # infrastructure is needed — just this dedicated step. No coverage floor:
    # this is thin integration glue, not unit-level logic.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"

      - name: Test
        working-directory: services/core/integrationtests
        run: go test ./... -race

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  golangci-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same module directories as build-and-test's matrix, plus
        # services/core/integrationtests (added by the testcontainers-go
        # module split — not part of build-and-test's own matrix since it has
        # no coverage floor, but it's still a real go.mod that needs linting
        # like every other one). Each is a separate go.mod and golangci-lint
        # (like go build/test) must be run from inside each one individually.
        module:
          - proto
          - services/core
          - services/core/integrationtests
          - services/sidecar
          - packages/sdks/go
          - deploy/sampleapp
          - cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}

  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same 7 go.mod directories as golangci-lint's matrix — govulncheck,
        # like golangci-lint, must be run from inside each module individually.
        module:
          - proto
          - services/core
          - services/core/integrationtests
          - services/sidecar
          - packages/sdks/go
          - deploy/sampleapp
          - cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan for known vulnerabilities
        # continue-on-error is deliberate here, not a rubber-stamp: verified
        # locally (2026-09-17) that every module's only "affected" findings
        # are Go standard-library CVEs fixed in a go1.26 patch release newer
        # than the go1.26.2 this repo's workflows currently pin (e.g.
        # GO-2026-5972 in encoding/asn1, fixed in go1.26.6) — zero third-party
        # dependency vulnerabilities are actually reachable from this repo's
        # code in any module. Bumping the pinned Go toolchain version is a
        # separate, deliberate change (touches every go.mod/setup-go step)
        # outside this CI-hardening pass's scope, so this job reports real
        # findings without blocking on that pre-existing, unrelated gap.
        working-directory: ${{ matrix.module }}
        continue-on-error: true
        run: $(go env GOPATH)/bin/govulncheck ./...

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        working-directory: packages/sdks/python
        # --no-deps on the editable install and a separate --require-hashes
        # install for coverage: pip refuses --require-hashes in the same
        # invocation as `-e .` ("no single file to hash"), so the two must
        # be split. ratecap itself declares zero runtime dependencies, so
        # --no-deps changes nothing functionally. See requirements-ci.txt
        # for the coverage hash and why its closure is just one package.
        run: |
          pip install --no-deps -e .
          pip install --require-hashes -r requirements-ci.txt

      - name: Test
        working-directory: packages/sdks/python
        run: coverage run -m unittest discover -s tests -v && coverage report --fail-under=50

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.15.9

      - name: Lint
        working-directory: packages/sdks/python
        run: ruff check .

      - name: Check formatting
        working-directory: packages/sdks/python
        run: ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install mypy
        run: pip install mypy==2.3.1

      - name: Type-check
        working-directory: packages/sdks/python
        run: mypy src

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and CI-tooling closure
        # Same install commands as the python-sdk job above (kept identical
        # rather than reused so this job stays a standalone, minimal-diff
        # addition) — audits the actual installed closure rather than
        # re-resolving requirements-ci.txt separately, since pip-audit's own
        # resolver doesn't honor --require-hashes the way pip does here.
        working-directory: packages/sdks/python
        run: |
          pip install --no-deps -e .
          pip install --require-hashes -r requirements-ci.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit installed package closure
        run: pip-audit

      - name: Audit publish-tooling closure
        run: pip-audit -r .github/publish-requirements.txt

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # deploy/ratecap.yaml is the single source of truth for shipped
      # defaults; values.yaml's embedded config.yaml block is generated from
      # it. Fails the same way `gofmt -l .` does if the two ever diverge.
      - name: Check embedded config is not stale
        run: |
          ./deploy/helm/ratecap/generate-config.sh
          git diff --exit-code deploy/helm/ratecap/values.yaml

      - name: Lint
        run: helm lint deploy/helm/ratecap

      - name: Template
        run: helm template test-release deploy/helm/ratecap --set sharedSecret.existingSecretName=test-secret --set concurrencySigningKey.existingSecretName=test-signing-key --set sampleapp.enabled=true

      - name: Template with mTLS enabled
        run: helm template test-release deploy/helm/ratecap --set sharedSecret.existingSecretName=test-secret --set concurrencySigningKey.existingSecretName=test-signing-key --set sampleapp.enabled=true --set tls.enabled=true --set tls.core.existingSecretName=test-core-tls --set tls.sidecar.existingSecretName=test-sidecar-tls

  checkov-iac-scan:
    # helm-lint above only checks rendering/functional correctness (`helm
    # lint`, `helm template`) — this job is the security-focused IaC scan
    # (privilege escalation, missing resource limits/securityContext, etc.)
    # against the same chart's rendered output.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Render chart to manifests
        run: |
          mkdir -p /tmp/rendered-manifests
          helm template test-release deploy/helm/ratecap --set sharedSecret.existingSecretName=test-secret --set concurrencySigningKey.existingSecretName=test-signing-key --set sampleapp.enabled=true > /tmp/rendered-manifests/manifests.yaml

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: /tmp/rendered-manifests
          framework: kubernetes
          output_format: sarif
          output_file_path: results.sarif
          # soft_fail: this is the chart's first-ever security-focused IaC
          # scan, so findings need a human triage pass before this becomes a
          # hard gate — results still upload to the Security tab below either way.
          soft_fail: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif

  mutation-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"

      - name: Install gremlins
        # v0.5.4 (as originally planned) does not exist on the module proxy —
        # verified against https://proxy.golang.org/github.com/go-gremlins/gremlins/@v/list;
        # v0.6.0 is the latest real tag.
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Mutation test services/core/limiter
        working-directory: services/core
        # --config points at the repo-root .gremlins.yaml explicitly: gremlins'
        # own config auto-discovery walks up only to the nearest go.mod, which
        # is this directory itself, so the repo-root file is otherwise never
        # found (verified locally). Path is a directory, not a package pattern
        # ("./limiter/..." errors with "matched no packages" — gremlins appends
        # its own "/..." suffix internally).
        run: $(go env GOPATH)/bin/gremlins unleash --config ../../.gremlins.yaml ./limiter

      - name: Mutation test packages/sdks/go
        working-directory: packages/sdks/go
        run: $(go env GOPATH)/bin/gremlins unleash --config ../../../.gremlins.yaml .

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [core, sidecar, sampleapp]
        include:
          - image: core
            dockerfile: services/core/Dockerfile
          - image: sidecar
            dockerfile: services/sidecar/Dockerfile
          - image: sampleapp
            dockerfile: deploy/sampleapp/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.image }} image
        run: docker build -f ${{ matrix.dockerfile }} -t ratecap-${{ matrix.image }}:ci .

      - name: Scan ${{ matrix.dockerfile }} for misconfigurations
        # exit-code 0 (non-blocking): verified locally (2026-09-17) that all
        # 3 Dockerfiles trip DS-0002 (HIGH — no non-root USER) — a real,
        # pre-existing finding this CI-hardening pass surfaces but leaves for
        # a dedicated follow-up rather than editing production Dockerfiles here.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.dockerfile }}
          exit-code: "0"

      - name: Scan ${{ matrix.image }} image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ratecap-${{ matrix.image }}:ci
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0" # non-blocking pending a maintainer triage pass — see note above

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate demo certs
        run: bash deploy/generate-demo-certs.sh

      - name: Bring up stack
        run: docker compose -f deploy/docker-compose.yml up --build -d

      - name: Wait for stack readiness
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz || true)
            if [ "$code" = "200" ]; then
              echo "stack ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "stack did not become ready in time" >&2
          docker compose -f deploy/docker-compose.yml logs
          exit 1

      - name: Exercise demo endpoints
        run: |
          check() {
            local path="$1"
            shift
            local allowed=("$@")
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000${path}")
            for a in "${allowed[@]}"; do
              if [ "$code" = "$a" ]; then
                echo "PASS ${path} -> ${code}"
                return 0
              fi
            done
            echo "FAIL ${path} -> ${code} (expected one of: ${allowed[*]})" >&2
            return 1
          }

          # slow-report/fleet-demo/worker-demo exercise tiers 2-4 against the
          # demo config's deliberately tight limits, so a 429/503 shed is an
          # expected outcome, not a failure — only checkout (tier 1 only,
          # rate 2/burst 5) is asserted as a plain 200.
          check /checkout 200
          check /slow-report 200 429
          check /fleet-demo 200 503
          check /worker-demo 200 503

      - name: Exercise Tier 2 bounded queueing (issue #48 prerequisite signal)
        # deploy/ratecap.yaml now ships queueing_enabled: true for
        # concurrency_limiter (default_max_concurrent: 3). This drives real
        # load past that cap on a shared key via the sidecar's own
        # /check+/release wire format (not the sample app, whose fixed
        # 2s /slow-report sleep would race unpredictably close to
        # max_queue_wait_ms's 2000ms deadline) and fails the job outright if
        # a genuine QUEUE decision is never observed — the exact prerequisite
        # signal issue #48 says must exist before Tier 3 queueing can even be
        # designed.
        run: |
          base=http://localhost:8080
          key=ci-queue-test

          # release_all releases every reservation a /check response header
          # block carries (Concurrency-Key-N/Token-N, N=0,1,2… — a single
          # /check can carry more than one, e.g. this key's own tier-2 slot
          # plus tier-3's shared "fleet" slot, per CLAUDE.md's own gotcha
          # note), so this test never leaks a reservation into later steps.
          release_all() {
            local hdrfile="$1"
            local i=0
            local tok key
            while true; do
              tok=$(grep -i "^Concurrency-Token-$i:" "$hdrfile" | awk '{print $2}' | tr -d '\r' || true)
              [ -z "$tok" ] && break
              key=$(grep -i "^Concurrency-Key-$i:" "$hdrfile" | awk '{print $2}' | tr -d '\r' || true)
              curl -s -o /dev/null -X POST "${base}/release" -H "X-RateCap-Concurrency-Key: ${key}" -H "X-RateCap-Concurrency-Token: ${tok}"
              i=$((i + 1))
            done
          }

          # x-ratecap-priority: critical on every call below is deliberate,
          # not incidental: fleet_shedder (tier 3, unconditionally next in
          # the pipeline after concurrency_limiter) halves sheddable's
          # effective cap via reserved_critical_pct (5 * (100-40)/100 == 3),
          # which 3 held sheddable reservations alone already saturate —
          # verified live, this shreds a 4th sheddable request at tier 3
          # regardless of what tier 2 does with it. critical uses fleet's
          # full cap (5) and also skips the sidecar-local tier 4 worker
          # shedder (RATECAP_MAX_INFLIGHT_REQUESTS: "3") entirely, isolating
          # tier 2's queueing from both unrelated caps.

          # Fill the demo cap (default_max_concurrent: 3) with 3 held
          # reservations on one shared key — sequential, not concurrent: the
          # hold only needs to exist before the 4th request below, not be
          # acquired simultaneously.
          for i in 1 2 3; do
            code=$(curl -s -D "/tmp/hdr_hold_${i}.txt" -o /dev/null -w '%{http_code}' -H "x-ratecap-priority: critical" "${base}/check?key=${key}")
            echo "hold ${i}: ${code}"
          done

          # A 4th request on the same key now finds the cap full. With
          # queueing_enabled, core's ConcurrencyLimiter.Check blocks inside
          # the gRPC call, polling every poll_interval_ms until a slot frees
          # or max_queue_wait_ms elapses — this is the QUEUE action under
          # test, not an instant 429.
          curl -s -w '%{time_total}' -D /tmp/hdr_queued.txt -o /dev/null -H "x-ratecap-priority: critical" "${base}/check?key=${key}" >/tmp/time_queued.txt &
          queued_pid=$!

          # Long enough to prove the 4th request is genuinely parked
          # waiting (not instantly rejected), comfortably short of
          # max_queue_wait_ms's 2000ms deadline.
          sleep 0.5

          for i in 1 2 3; do
            release_all "/tmp/hdr_hold_${i}.txt"
          done

          wait "${queued_pid}" || true
          queued_code=$(head -1 /tmp/hdr_queued.txt | awk '{print $2}' | tr -d '\r' || true)
          queued_time=$(cat /tmp/time_queued.txt 2>/dev/null || true)
          echo "queued request: HTTP ${queued_code} after ${queued_time}s"
          release_all /tmp/hdr_queued.txt

          # Pipeline.Check attributes a QUEUE decision's Tier to whichever
          # tier ran last and returned a non-empty Tier (fleet_shedder, since
          # it always runs after concurrency_limiter) — see
          # TestPipeline_QueueFromEarlierTierContinuesToLaterTier in
          # services/core/limiter/pipeline_test.go — so this matches on the
          # action label alone, which only ConcurrencyLimiter ever sets to
          # "queue", rather than assuming a specific tier label. Prometheus
          # renders labels alphabetically, not in the CounterVec's declared
          # order, so this greps the whole line rather than a fixed label
          # position.
          metrics=$(curl -s "${base}/metrics")
          echo "$metrics" | grep '^ratecap_decisions_total' || true
          queue_total=$(echo "$metrics" | awk '/^ratecap_decisions_total\{/ && /action="queue"/ { sum += $NF } END { print sum + 0 }')
          echo "ratecap_decisions_total{...,action=\"queue\"} = ${queue_total}"
          if [ "${queue_total}" -lt 1 ]; then
            echo "FAIL: Tier 2 queueing never produced a QUEUE decision — queueing_enabled may be off or misconfigured" >&2
            exit 1
          fi

      - name: Tear down stack
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml down -v
          rm -rf deploy/certs

  all-checks-pass:
    # Single stable status-check context for branch protection, so a
    # ruleset can require just this job instead of enumerating every matrix
    # leg of build-and-test/golangci-lint/docker-build individually.
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - core-integration-tests
      - gofmt
      - golangci-lint
      - govulncheck
      - python-sdk
      - ruff
      - mypy
      - pip-audit
      - helm-lint
      - checkov-iac-scan
      - mutation-testing
      - docker-build
      - e2e-smoke
    # always() is required: without it, this job is skipped whenever any
    # dependency fails, and GitHub branch protection treats a skipped
    # required check as passing. This job exists specifically to turn that
    # "skipped" into a real "failure".
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          failed=0

          check() {
            local job="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "FAIL: $job -> $result" >&2
              failed=1
            else
              echo "OK: $job -> $result"
            fi
          }

          check "build-and-test" "${{ needs.build-and-test.result }}"
          check "core-integration-tests" "${{ needs.core-integration-tests.result }}"
          check "gofmt" "${{ needs.gofmt.result }}"
          check "golangci-lint" "${{ needs.golangci-lint.result }}"
          check "govulncheck" "${{ needs.govulncheck.result }}"
          check "python-sdk" "${{ needs.python-sdk.result }}"
          check "ruff" "${{ needs.ruff.result }}"
          check "mypy" "${{ needs.mypy.result }}"
          check "pip-audit" "${{ needs.pip-audit.result }}"
          check "helm-lint" "${{ needs.helm-lint.result }}"
