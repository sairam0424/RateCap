name: Publish Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: sairam0424

permissions:
  contents: read

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write # sbom-action uploads SBOMs as GitHub Release assets
      packages: write
      actions: read # sbom-action reads its own uploaded workflow artifact back
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [core, sidecar, sampleapp]
        include:
          - image: core
            dockerfile: services/core/Dockerfile
          - image: sidecar
            dockerfile: services/sidecar/Dockerfile
          - image: sampleapp
            dockerfile: deploy/sampleapp/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/ratecap-${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/ratecap-${{ matrix.image }}:${{ github.ref_name }}

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/ratecap-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: ratecap-${{ matrix.image }}.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/ratecap-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish-cli-binaries:
    # windows/arm64 is intentionally excluded: 5 real targets, not 6 — Go's
    # windows/arm64 port has no first-party consumer here and matches the
    # matrix shape called out in the release plan.
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload needs write access to attach assets
      id-token: write # cosign keyless signing + attest-build-provenance mint Fulcio/Rekor OIDC tokens
      attestations: write # attest-build-provenance writes to this repo's attestation store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"

      - name: Build cross-platform binaries
        working-directory: cli
        env:
          # Never splice ${{ }} template values directly into a run: script
          # (GitHub substitutes them into the script TEXT before the shell
          # ever parses it — a tag name containing a shell metacharacter
          # would inject arbitrary commands into a job with contents:write/
          # id-token:write/attestations:write). Route through env: instead,
          # so the value only ever reaches the shell as an opaque variable.
          RATECAP_CLI_VERSION: ${{ github.ref_name }}
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="ratecapctl_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              out="${out}.exe"
            fi
            echo "building ${out}"
            GOOS="$os" GOARCH="$arch" go build -ldflags "-X github.com/sairam0424/RateCap/cli/cmd.Version=${RATECAP_CLI_VERSION}" -o "$out" .
          done

      - name: Generate checksums
        working-directory: cli
        run: sha256sum ratecapctl_* > checksums.txt

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums with cosign (keyless)
        working-directory: cli
        run: cosign sign-blob --yes --bundle=checksums.txt.bundle checksums.txt

      - name: Extract plain .sig from the bundle (for Scorecard's Signed-Releases probe)
        # OpenSSF Scorecard's releasesAreSigned probe only recognizes a fixed
        # set of release-asset filename suffixes (.asc/.minisig/.sig/.sign/
        # .sigstore/.sigstore.json) -- it does not know cosign's own --bundle
        # format. Rather than sign a second time (this cosign version's
        # legacy stdout-signature mode errors without --bundle: "create
        # bundle file: open : no such file or directory"), pull the base64
        # signature out of the same bundle just created above --
        # messageSignature.signature per sigstore-protobuf-specs'
        # sigstore_bundle.proto / sigstore_common.proto -- so this is the
        # exact same signing operation, just also exposed under a suffix the
        # probe checks for. The --bundle file remains the documented,
        # recommended verification path in README.md.
        working-directory: cli
        run: jq -r '.messageSignature.signature' checksums.txt.bundle > checksums.txt.sig

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cli/ratecapctl_*
            cli/checksums.txt

      - name: Upload release assets
        working-directory: cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RATECAP_RELEASE_TAG: ${{ github.ref_name }}
          RATECAP_REPO: ${{ github.repository }}
        run: |
          # gh release upload requires the release object to already exist —
          # it does NOT auto-create one. This repo's own release process
          # creates the curated GitHub Release by hand after CI runs, so on
          # the very first push of a tag, no release exists yet at this
          # point. Create a placeholder (auto-generated notes) if needed;
          # the later hand-curated `gh release edit` step overwrites its
          # notes without needing to delete/recreate it.
          if ! gh release view "$RATECAP_RELEASE_TAG" --repo "$RATECAP_REPO" >/dev/null 2>&1; then
            gh release create "$RATECAP_RELEASE_TAG" --repo "$RATECAP_REPO" --title "$RATECAP_RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RATECAP_RELEASE_TAG" ratecapctl_* checksums.txt checksums.txt.bundle checksums.txt.sig --repo "$RATECAP_REPO"

  publish-helm-chart:
    # OCI push replaces the old helm/chart-releaser-action publish, which
    # targeted a gh-pages branch that has never existed on this repo (every
    # release with chart changes has silently failed at that step). Helm's
    # OCI support has been the default, non-experimental distribution model
    # since v3.8.0, and chart-releaser itself still has no native OCI push
    # support (upstream helm/chart-releaser#622, open/unmerged).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Log in to GHCR (ORAS)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package chart
        run: helm package deploy/helm/ratecap

      - name: Push chart to GHCR
        id: push
        run: |
          output="$(helm push ratecap-*.tgz "oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/charts" 2>&1 | tee /dev/stderr)"
          digest="$(echo "$output" | grep -oE 'sha256:[0-9a-f]{64}')"
          if [ -z "$digest" ]; then
            echo "could not parse chart digest from helm push output" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign chart digest with cosign (keyless)
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/charts/ratecap@${{ steps.push.outputs.digest }}"

      - name: Attest chart build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/charts/ratecap
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Push Artifact Hub repository metadata
        # Pushed as a sibling OCI artifact tagged ":artifacthub.io" next to
        # the chart itself — this is the mechanism Artifact Hub documents for
        # OCI-based Helm repositories, distinct from the gh-pages/index.yaml
        # model chart-releaser used (see helm_charts_repositories.md#oci-support).
        run: |
          oras push "${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/charts/ratecap:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            deploy/helm/ratecap/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
