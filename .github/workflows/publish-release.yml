name: Publish Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: sairam0424

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [core, sidecar, sampleapp]
        include:
          - image: core
            dockerfile: services/core/Dockerfile
          - image: sidecar
            dockerfile: services/sidecar/Dockerfile
          - image: sampleapp
            dockerfile: deploy/sampleapp/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/ratecap-${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/ratecap-${{ matrix.image }}:${{ github.ref_name }}

  publish-helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - name: Configure git identity for chart-releaser
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: helm/chart-releaser-action@v1
        with:
          charts_dir: deploy/helm
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
