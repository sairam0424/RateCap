name: Publish Python SDK

on:
  push:
    tags:
      - "python-sdk-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build
        # See .github/publish-requirements.txt for the hash-pinned
        # build/packaging/pyproject_hooks closure and how it was derived.
        run: pip install --require-hashes -r .github/publish-requirements.txt

      - name: Build distributions
        working-directory: packages/sdks/python
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: packages/sdks/python/dist
