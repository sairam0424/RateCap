name: Feature Request
description: Propose new functionality or an enhancement to RateCap.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        RateCap v1 is scoped strictly to Stripe's four rate-limiting/load-shedding tiers — see the
        [scope discipline section](../../CONTRIBUTING.md#scope-discipline) in CONTRIBUTING.md before proposing
        a fifth limiting mechanism, a new storage backend, or a non-Go core; those require a design spec and
        explicit sign-off first.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - services/core
        - services/sidecar
        - packages/sdks/go
        - packages/sdks/python
        - cli
        - proto
        - deploy/helm/ratecap (Helm chart)
        - deploy/sampleapp (demo)
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or gap this addresses. Avoid jumping straight to the solution here.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've considered, and why you didn't pick them.
    validations:
      required: false
