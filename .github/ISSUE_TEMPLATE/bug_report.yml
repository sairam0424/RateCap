name: Bug Report
description: Report a defect in RateCap's behavior, build, or docs.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please search [existing issues](https://github.com/sairam0424/RateCap/issues) to avoid duplicates.
        For security vulnerabilities, use [private reporting](https://github.com/sairam0424/RateCap/security/advisories/new) instead — see [SECURITY.md](../../SECURITY.md).

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - services/core
        - services/sidecar
        - packages/sdks/go
        - packages/sdks/python
        - cli
        - proto
        - deploy/helm/ratecap (Helm chart)
        - deploy/sampleapp (demo)
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: RateCap version
      description: Tag, commit SHA, or `main` — see the [`VERSION`](../../VERSION) file.
      placeholder: v2.10.1
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal repro steps — commands run, config used, requests sent.
      placeholder: |
        1. cd deploy && bash generate-demo-certs.sh && docker compose up --build
        2. curl http://localhost:3000/checkout (repeat 6+ times)
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant logs, stack traces, or error output.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, Docker version, deployment mode (docker-compose vs Helm), etc.
      placeholder: macOS 15, Go 1.26.2, Docker 27, docker-compose
