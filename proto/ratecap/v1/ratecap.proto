syntax = "proto3";

package ratecap.v1;

option go_package = "github.com/sairam0424/RateCap/proto/ratecap/v1;ratecapv1";

service RatecapService {
  rpc CheckRateLimit(CheckRateLimitRequest) returns (CheckRateLimitResponse);
  rpc ReleaseConcurrency(ReleaseConcurrencyRequest) returns (ReleaseConcurrencyResponse);
  rpc SetDynamicLimit(SetDynamicLimitRequest) returns (SetDynamicLimitResponse);
  rpc RefundCost(RefundCostRequest) returns (RefundCostResponse);
}

enum Action {
  ALLOW = 0;
  REJECT_429 = 1;
  REJECT_503 = 2;
  SHADOW_LOG = 3;
  QUEUE = 4;
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  SHEDDABLE = 1;
  CRITICAL = 2;
}

message TokenReservation {
  string key = 1;
  string token = 2;
}

message CheckRateLimitRequest {
  string key = 1;
  int32 cost = 2;
  bool skip_reservations = 3;
  Priority priority = 4;
}

message CheckRateLimitResponse {
  Action action = 1;
  int64 retry_after_ms = 2;
  repeated TokenReservation reservations = 3;
  string tier = 4;
}

message ReleaseConcurrencyRequest {
  string key = 1;
  string concurrency_token = 2;
}

message ReleaseConcurrencyResponse {}

message SetDynamicLimitRequest {
  string tier = 1; // "rate_limiter" or "fleet_shedder"
  int32 value = 2; // rate_limiter: new rate (requests/sec); fleet_shedder: new reserved_critical_pct (0-100)
}

message SetDynamicLimitResponse {
  string tier = 1;
  int32 previous_value = 2;
  int32 new_value = 3;
}

message RefundCostRequest {
  string key = 1;
  int32 refund_amount = 2; // tokens to return to Tier 1's bucket for this key, clamped to burst
}

message RefundCostResponse {}
